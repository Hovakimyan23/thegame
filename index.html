<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="game">
        <div class="game__card">
            <header class="game__header">
                <h1 class="game__title">Number Guess</h1>
                <p class="game__subtitle">Guess a number between 1 and 100</p>
            </header>

            <div class="game__stats">
                <div class="stat">
                    <span class="stat__label">Attempts</span>
                    <span class="stat__value" id="attempts">0</span>
                </div>
                <div class="stat">
                    <span class="stat__label">Best Score</span>
                    <span class="stat__value" id="best">—</span>
                </div>
            </div>

            <div class="game__feedback" id="feedback" role="status" aria-live="polite">
                <span class="feedback__text">Start guessing!</span>
            </div>

            <form class="game__form" id="guessForm" autocomplete="off">
                <input
                    type="number"
                    id="guessInput"
                    class="game__input"
                    min="1"
                    max="100"
                    placeholder="Enter your guess"
                    inputmode="numeric"
                    required
                >
                <button type="submit" class="game__button" id="guessBtn">Guess</button>
            </form>

            <div class="game__range">
                <span class="range__label">Range</span>
                <span class="range__value" id="rangeMin">1</span>
                <span class="range__bar"></span>
                <span class="range__value" id="rangeMax">100</span>
            </div>

            <button class="game__reset" id="resetBtn" hidden>Play Again</button>
        </div>
    </main>

    <script type="module" src="js/index.js"></script>
</body>
</html>
